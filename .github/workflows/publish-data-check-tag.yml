name: Publish Immutable Data Check Tag

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Managed generated-data branch
        required: true
        type: string
      expected_sha:
        description: Exact branch head to tag and test
        required: true
        type: string

concurrency:
  group: data-check-tag-${{ inputs.expected_sha }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  publish:
    name: Publish trusted immutable check tag
    environment: data-check-tag-publisher
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted master workflow ref
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]]

      - name: Check out trusted master workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: master

      - name: Validate candidate before minting write credentials
        id: validate
        env:
          BOT_REF: ${{ inputs.ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ "$BOT_REF" != "automation/livestream-data" || ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'invalid managed branch or SHA\n' >&2
            exit 1
          fi
          git fetch --no-tags origin master "+refs/heads/${BOT_REF}:refs/remotes/origin/${BOT_REF}"
          remote_sha=$(git rev-parse "refs/remotes/origin/${BOT_REF}")
          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            printf 'managed branch moved before tag publication\n' >&2
            exit 1
          fi
          base_sha=$(git rev-parse origin/master)
          .github/scripts/validate-bot-candidate.sh "$base_sha" "$EXPECTED_SHA"
          tag_name="data-check/${EXPECTED_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'tag_name=%s\n' "$tag_name" >> "$GITHUB_OUTPUT"

      - name: Mint narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DATA_CHECK_TAG_APP_ID }}
          private-key: ${{ secrets.DATA_CHECK_TAG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: website
          permission-contents: write

      - name: Create and verify immutable tag
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TAG_NAME: ${{ steps.validate.outputs.tag_name }}
        run: |
          set -euo pipefail
          current_sha=$(git ls-remote origin "refs/heads/${{ inputs.ref }}" | awk '{print $1}')
          [[ "$current_sha" == "$EXPECTED_SHA" ]]
          GH_TOKEN="$APP_TOKEN" gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG_NAME}" -f sha="$EXPECTED_SHA" >/dev/null
          tagged_sha=$(git ls-remote origin "refs/tags/${TAG_NAME}" | awk '{print $1}')
          if [[ "$tagged_sha" != "$EXPECTED_SHA" ]]; then
            printf 'immutable tag verification failed\n' >&2
            exit 1
          fi

      - name: Dispatch CI at immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.validate.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$TAG_NAME" \
            -f ref="${{ inputs.ref }}" -f expected_sha="${{ inputs.expected_sha }}"
