name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Managed data branch associated with an immutable check tag
        required: true
        type: string
      expected_sha:
        description: Exact managed-branch head SHA to validate
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  validate-dispatch:
    name: Validate dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate immutable bot dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          BOT_REF: ${{ inputs.ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BOT_REF" || -z "$EXPECTED_SHA" ]]; then
            printf 'ref and expected_sha must be provided together\n' >&2
            exit 1
          fi
          if [[ "$BOT_REF" != "automation/livestream-data" ]]; then
            printf 'unexpected managed branch: %s\n' "$BOT_REF" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/data-check/ ]]; then
            printf 'bot CI must run from the reserved immutable tag namespace\n' >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            printf 'dispatch SHA mismatch: %s != %s\n' "$GITHUB_SHA" "$EXPECTED_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin master "+refs/heads/${BOT_REF}:refs/remotes/origin/${BOT_REF}"
          remote_sha=$(git rev-parse "refs/remotes/origin/${BOT_REF}")
          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            printf 'managed branch moved: %s != %s\n' "$remote_sha" "$EXPECTED_SHA" >&2
            exit 1
          fi
          base_sha=$(git rev-parse origin/master)
          .github/scripts/validate-bot-candidate.sh "$base_sha" "$EXPECTED_SHA"

  formatting:
    name: Formatting
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  markdown-lint:
    name: Markdown lint
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:markdown

  astro-check:
    name: Astro check
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  unit-tests:
    name: Unit tests
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build-route-validation:
    name: Build and route validation
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:repeat
      - run: npm run validate:routes

  browser-tests:
    name: Browser tests
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:browser:all

  lighthouse:
    name: Lighthouse
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:lighthouse

  npm-audit:
    name: npm audit
    needs: validate-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run audit

  dependency-review:
    name: Dependency review
    needs: validate-dispatch
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
      - name: Confirm dependency manifests are trusted
        if: github.event_name != 'pull_request'
        run: echo "Dependency review is satisfied by the validated exact-commit path allowlist."

  codeql:
    name: CodeQL
    needs: validate-dispatch
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
