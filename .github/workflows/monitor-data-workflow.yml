name: Monitor Livestream Data Workflow

on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [Update Livestreams Data]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: monitor-livestream-data-workflow
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  monitor:
    name: Monitor reconciliation health
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile durable tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Livestream data workflow needs reconciliation"
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/update-livestreams.yml/runs?per_page=100")
          latest_status=$(jq -r '.workflow_runs | sort_by(.created_at) | last | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end' <<< "$runs")
          latest_url=$(jq -r '.workflow_runs | sort_by(.created_at) | last | .html_url // "unavailable"' <<< "$runs")
          latest_id=$(jq -r '.workflow_runs | sort_by(.created_at) | last | .id // "null"' <<< "$runs")
          latest_head=$(jq -r '.workflow_runs | sort_by(.created_at) | last | .head_branch // "missing"' <<< "$runs")
          annotations=""
          required_jobs="missing"
          if [[ "$latest_id" != "null" ]]; then
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${latest_id}/jobs?filter=all&per_page=100")
            annotations=$(jq -r '[.jobs[].steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join(", ")' <<< "$jobs")
            required_jobs=$(jq -r \
              '[.jobs[] | select(.name == "Update livestream data" or .name == "Update chat replays" or .name == "Reconcile data pull request") | select(.conclusion == "success")] | if length == 3 then "success" else "incomplete" end' \
              <<< "$jobs")
          fi
          issue_number=$(gh issue list --state open --search "${ISSUE_TITLE} in:title" --json number,title \
            --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n 1)
          ci_status="missing"
          data_healthy="false"
          if [[ "$latest_status" == "completed:success" && "$latest_head" == "master" && "$required_jobs" == "success" ]]; then
            data_healthy="true"
            final_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/automation/livestream-data" --jq '.object.sha' 2>/dev/null || true)
            if [[ "$final_sha" =~ ^[0-9a-f]{40}$ ]]; then
              master_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
              if [[ "$final_sha" == "$master_sha" ]]; then
                ci_status="not-required"
              else
                ci_status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${final_sha}&event=workflow_dispatch&per_page=20" \
                  --jq '[.workflow_runs[] | select((.head_branch // "") | startswith("data-check/"))] | sort_by(.created_at) | last | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end')
              fi
            fi
          fi
          if [[ "$data_healthy" == "true" && ( "$ci_status" == "completed:success" || "$ci_status" == "not-required" ) ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue close "$issue_number" --comment "A full serialized reconciliation and exact-head immutable-tag CI completed successfully: ${latest_url}"
            fi
            exit 0
          fi
          body=$(printf "The retained livestream workflow is not reconciled.\n\nLatest data-workflow state: \`%s\`\nLatest run branch: \`%s\`\nRequired job state: \`%s\`\nExact-head immutable-tag CI state: \`%s\`\nLatest run: %s\nFailed or cancelled steps: \`%s\`\n\nThis includes queue-limit cancellations and requires the next accepted or manual run to complete data, chat, PR, and exact-head CI reconciliation." "$latest_status" "$latest_head" "$required_jobs" "$ci_status" "$latest_url" "${annotations:-unavailable}")
          if [[ -z "$issue_number" ]]; then
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          else
            gh issue comment "$issue_number" --body "$body"
          fi
