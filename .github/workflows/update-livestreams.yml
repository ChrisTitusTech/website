name: Update Livestreams Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: livestream-data-reconciliation
  cancel-in-progress: false

env:
  DATA_BRANCH: automation/livestream-data
  PLAYLIST_ID: PLc7fktTRMBow1ksFW020hx2XEKabaD5Vd
  TWITCH_DOWNLOADER_VERSION: 1.56.5
  TWITCH_DOWNLOADER_SHA256: f2bcee00d0e6da759d97c23767345634cb9cdb10cdff96cfa96f97983d51bf55

jobs:
  update-livestreams:
    name: Update livestream data
    environment: livestream-data-automation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.branch.outputs.base_sha }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Require trusted master workflow ref
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]]

      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore or create managed branch
        id: branch
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch --no-tags origin master:refs/remotes/origin/master
          base_sha=$(git rev-parse origin/master)
          previous_sha=""
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"
            previous_sha=$(git rev-parse "refs/remotes/origin/${DATA_BRANCH}")
          fi
          git checkout -B "$DATA_BRANCH" "$base_sha"
          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'previous_sha=%s\n' "$previous_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement scripts/requirements-automation.txt

      - name: Fetch playlist data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch-livestreams.py

      - name: Commit and publish data head
        id: publish
        env:
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
          PREVIOUS_SHA: ${{ steps.branch.outputs.previous_sha }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/livestreams.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update livestreams data"
          fi
          candidate_sha=$(git rev-parse HEAD)
          .github/scripts/validate-bot-candidate.sh "$BASE_SHA" "$candidate_sha"
          if [[ -n "$PREVIOUS_SHA" ]]; then
            git push --force-with-lease="refs/heads/${DATA_BRANCH}:${PREVIOUS_SHA}" origin "HEAD:refs/heads/${DATA_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${DATA_BRANCH}"
          fi
          remote_sha=$(git ls-remote origin "refs/heads/${DATA_BRANCH}" | awk '{print $1}')
          [[ "$remote_sha" == "$candidate_sha" ]]
          printf 'sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"

  update-chat:
    name: Update chat replays
    needs: update-livestreams
    environment: livestream-data-automation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Check out predecessor SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.update-livestreams.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify predecessor and attach managed branch
        env:
          EXPECTED_SHA: ${{ needs.update-livestreams.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          remote_sha=$(git ls-remote origin "refs/heads/${DATA_BRANCH}" | awk '{print $1}')
          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            printf 'managed branch moved before chat job: %s != %s\n' "$remote_sha" "$EXPECTED_SHA" >&2
            exit 1
          fi
          git checkout -B "$DATA_BRANCH" "$EXPECTED_SHA"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement scripts/requirements-automation.txt

      - name: Match Twitch VODs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/match-twitch-vods.py

      - name: Install pinned TwitchDownloader CLI
        run: |
          set -euo pipefail
          archive="TwitchDownloaderCLI-${TWITCH_DOWNLOADER_VERSION}-Linux-x64.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/lay295/TwitchDownloader/releases/download/${TWITCH_DOWNLOADER_VERSION}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$TWITCH_DOWNLOADER_SHA256" "$archive" | sha256sum --check --strict
          unzip -q "$archive" TwitchDownloaderCLI
          chmod 0755 TwitchDownloaderCLI

      - name: Download missing chat replays
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/download-chat-replays.py

      - name: Refresh chat replay flags
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch-livestreams.py

      - name: Commit and publish final data head
        id: publish
        env:
          PREDECESSOR_SHA: ${{ needs.update-livestreams.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/livestreams.json public/chats/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update chat replays"
          fi
          final_sha=$(git rev-parse HEAD)
          base_sha=$(git rev-parse origin/master)
          .github/scripts/validate-bot-candidate.sh "$base_sha" "$final_sha"
          git push --force-with-lease="refs/heads/${DATA_BRANCH}:${PREDECESSOR_SHA}" \
            origin "HEAD:refs/heads/${DATA_BRANCH}"
          remote_sha=$(git ls-remote origin "refs/heads/${DATA_BRANCH}" | awk '{print $1}')
          if [[ "$remote_sha" != "$final_sha" ]]; then
            printf 'managed branch moved after chat job: %s != %s\n' "$remote_sha" "$final_sha" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$final_sha" >> "$GITHUB_OUTPUT"

  validate-data:
    name: Validate generated site
    needs: update-chat
    environment: livestream-data-automation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out final SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.update-chat.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Build generated site
        run: npm run build

      - name: Validate generated routes
        run: npm run validate:routes

  publish-master:
    name: Publish livestream data to master
    needs: [update-livestreams, update-chat, validate-data]
    environment: livestream-data-automation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out final SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.update-chat.outputs.sha }}

      - name: Fast-forward master to validated data
        env:
          BASE_SHA: ${{ needs.update-livestreams.outputs.base_sha }}
          FINAL_SHA: ${{ needs.update-chat.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          remote_master=$(git rev-parse origin/master)
          if [[ "$remote_master" != "$BASE_SHA" ]]; then
            printf 'master moved before livestream publication: %s != %s\n' "$remote_master" "$BASE_SHA" >&2
            exit 1
          fi
          remote_data=$(git ls-remote origin "refs/heads/${DATA_BRANCH}" | awk '{print $1}')
          if [[ "$remote_data" != "$FINAL_SHA" ]]; then
            printf 'managed branch moved before livestream publication: %s != %s\n' "$remote_data" "$FINAL_SHA" >&2
            exit 1
          fi
          .github/scripts/validate-bot-candidate.sh "$BASE_SHA" "$FINAL_SHA"
          if [[ "$FINAL_SHA" == "$BASE_SHA" ]]; then
            printf 'livestream data already matches master at %s\n' "$FINAL_SHA"
            exit 0
          fi
          git merge-base --is-ancestor "$BASE_SHA" "$FINAL_SHA"
          git push origin "$FINAL_SHA:refs/heads/master"
          published_sha=$(git ls-remote origin refs/heads/master | awk '{print $1}')
          [[ "$published_sha" == "$FINAL_SHA" ]]
